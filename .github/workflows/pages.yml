name: Build and deploy website

on:
  pull_request:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - openroadcode-updated
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          path: website

      - name: Check out Open Road Code
        uses: actions/checkout@v4
        with:
          repository: markisrt4/OpenRoadCode
          path: source

      - name: Check out libMusicForge
        uses: actions/checkout@v4
        with:
          repository: markisrt4/libMusicForge
          path: musicforge
          persist-credentials: false

      - name: Check out libSDRForge
        uses: actions/checkout@v4
        with:
          repository: markisrt4/libSDRForge
          path: sdrforge
          persist-credentials: false

      - name: Import README files
        run: |
          python3 website/scripts/import_readmes.py \
            --source source \
            --output website/_docs \
            --tree-output website/_data/docs_tree.json

          echo "Generated documentation:"
          find website/_docs -type f -print

          echo "Generated documentation tree:"
          cat website/_data/docs_tree.json

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen

      - name: Generate API reference
        working-directory: website
        env:
          DOXYGEN_SITE_DIRECTORY: ${{ github.workspace }}/website
          DOXYGEN_INPUT_DIRECTORY: ${{ github.workspace }}/source
          DOXYGEN_OUTPUT_DIRECTORY: ${{ runner.temp }}/openroadcode-doxygen
        run: |
          # Keep website filenames out of Doxygen's relative Markdown link lookup.
          doxygen_workdir="$(mktemp -d)"
          (
            cd "$doxygen_workdir"
            doxygen "${DOXYGEN_SITE_DIRECTORY}/Doxyfile"
          )

          echo "Generated Doxygen HTML:"
          find "${DOXYGEN_OUTPUT_DIRECTORY}/html" -maxdepth 1 -type f -print

          mkdir -p api
          cp -a "${DOXYGEN_OUTPUT_DIRECTORY}/html/." api/
          test -f api/index.html

      - name: Generate Forge API references
        working-directory: website
        env:
          FORGE_SOURCE_ROOT: ${{ github.workspace }}
          FORGE_BUILD_ROOT: ${{ runner.temp }}
        run: |
          build_reference() {
            local package="$1"
            local output="${FORGE_BUILD_ROOT}/${package}-doxygen"
            FORGE_PROJECT_NAME="$2" \
              FORGE_INPUT_DIRECTORY="${FORGE_SOURCE_ROOT}/${package}/src/${package}" \
              FORGE_OUTPUT_DIRECTORY="$output" \
              doxygen doxygen/Doxyfile.forge

            test -f "${output}/html/index.html"
            mkdir -p "api/${package}"
            cp -a "${output}/html/." "api/${package}/"
          }

          build_reference musicforge libMusicForge
          build_reference sdrforge libSDRForge

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: website
          destination: website/_site

      - name: Check published Forge reference entry points
        run: |
          test -f website/_site/api/musicforge/index.html
          test -f website/_site/api/sdrforge/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
